server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Content-Security-Policy — explicit, allows Google tag (gtag.js/GTM/tag gateway),
        # Meta Pixel, Google Fonts, CloudFront media and our own Grand OS API/subdomains.
        # Added 08/09 in response to Google Ads Tag Diagnostics "Urgente" alert (CSP blocking measurement).
        # 09/09: added www.googleadservices.com - the Google Ads conversion ping goes there
        # when the visitor GRANTS consent (directly, and via a redirect from
        # www.google.com/pagead/1p-conversion). It was missing from script-src, connect-src,
        # img-src and frame-src, so every consented conversion was blocked by CSP and dropped
        # silently (navigator.sendBeacon returns true even when the CSP blocks it).
        # 2026-09-11 (Infra): + https://www.google.com.br no connect-src. O ping
        # first-party (www.google.com/pagead/1p-conversion) e o de view-through
        # redirecionam para o ccTLD .com.br, e o CSP vale em cada salto do redirect —
        # sem o ccTLD liberado os dois morrem na origem, em silencio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://tagmanager.google.com https://connect.facebook.net https://*.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://www.googletagmanager.com https://*.doubleclick.net https://google.com https://www.google.com https://connect.facebook.net https://os.enviandomeucarro.com https://api.enviandomeucarro.com https://calculadora.enviandomeucarro.com https://www.googleadservices.com https://www.google.com.br; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com https://*.google.com https://*.doubleclick.net https://www.facebook.com https://d2xsxph8kpxj0f.cloudfront.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.googletagmanager.com https://*.doubleclick.net https://www.googleadservices.com; base-uri 'self'; object-src 'none';" always;

    # Cache static assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images and fonts
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Sitemap proxy to Grand OS
    location = /sitemap.xml {
        proxy_pass https://os.enviandomeucarro.com/api/public/cms/sitemap.xml;
        proxy_set_header Host os.enviandomeucarro.com;
        proxy_ssl_server_name on;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
